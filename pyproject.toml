[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "mule-ring-hunter"
version = "1.0.1"
description = "Money-mule ring detection with a directed GraphSAGE and XGBoost ensemble, and an analysis API"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.0",
    "scipy>=1.11",
    "scikit-learn>=1.4",
    "xgboost-cpu>=2.1",  # same xgboost module, without the CUDA libraries
    "torch>=2.2",
    "torch-geometric>=2.5",
    "networkx>=3.2",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "pydantic>=2.6",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "prometheus-client>=0.20",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "httpx2>=2.0", "ruff>=0.6", "bandit>=1.7", "pip-audit>=2.7"]
dashboard = ["streamlit>=1.40", "plotly>=5.18"]

[project.scripts]
mulehunter = "mulehunter.__main__:main"

[tool.setuptools]
packages = ["mulehunter"]

[tool.setuptools.package-data]
mulehunter = ["migrations/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.coverage.run]
source = ["mulehunter"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B"]
ignore = ["B008", "B905", "E731"]  # Depends() defaults are FastAPI's idiom; zip(strict=) and lambdas are style

[tool.ruff.lint.per-file-ignores]
# the simulator's helper closures are called within the loop iteration that defines them; editing them
# would risk changing the generated data and every published number
"mulehunter/simulate.py" = ["B023", "E741"]
